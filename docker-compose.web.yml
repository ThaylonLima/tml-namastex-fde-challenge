# Extra opcional (fora do escopo avaliado): frontend de chat + proxy reverso para o agente.
# Não altera nenhum serviço do docker-compose.yml oficial; só acrescenta o serviço "web" e endurece
# a exposição quando usado em conjunto:
#
#   docker compose -f docker-compose.yml -f docker-compose.web.yml up -d --build
#
# REQUER Docker Compose >= 2.24.4 (tag `!override`; docs.docker.com/reference/compose-file/merge/).
# Verifique com `docker compose version`. Em versões anteriores o `ports` seria somado ao do arquivo
# base e o agente/legado continuariam publicados em todas as interfaces.
#
# A porta pública do `web` fica presa ao loopback: o acesso externo passa pelo Cloudflare Tunnel.
# Endpoints admin do agente seguem como no código; em ambiente público defina ADMIN_TOKEN e
# SESSION_ID_SALT no .env. Deploy/rollback: docs/ARQUITETURA.md §13.4 (agente e web do MESMO commit).
services:
  agent:
    ports: !override
      - "127.0.0.1:8080:8080"
  quote-api:
    ports: !override
      - "127.0.0.1:8000:8000"
  web:
    image: nginx:1.28-alpine   # >= 1.27.3 (resolve em upstream); não usar `latest`
    depends_on:
      agent:
        condition: service_healthy   # usa o HEALTHCHECK do Dockerfile do agente
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/nginx.main.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # a rota /autoseguro/api/health não existe mais: a própria página estática é o sinal de vida
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/autoseguro/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

# Sub-rede FIXA: o nginx só confia no CF-Connecting-IP vindo daqui (set_real_ip_from em nginx.conf).
# Se 172.29.77.0/24 colidir com outra rede do servidor, troque aqui E em web/nginx.conf.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.77.0/24
