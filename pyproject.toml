[project]
name = "autoseguro-agent"
version = "0.1.0"
description = "Agente de vendas de seguro auto (WhatsApp) da AutoSeguro - desafio FDE Namastex"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyarrow>=26.0.0",
    "pydantic>=2.6",
    "tenacity>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
