# Frontend de demonstração do AutoSeguro (fora do escopo avaliado do desafio).
# Serve o chat em /autoseguro/ e expõe SOMENTE duas rotas do agente:
#   /autoseguro/api/chat    -> agent:8080/chat    (POST)
#   /autoseguro/api/health  -> agent:8080/health  (GET)
# /sessions/{id} e /maintenance/sweep NÃO são publicados (ficam só na rede interna).

# IP real do visitante: o Cloudflare Tunnel envia CF-Connecting-IP; sem ele (teste local), usa o socket.
map $http_cf_connecting_ip $client_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# Demo pública: ~30 mensagens/min por visitante, com rajada curta.
limit_req_zone $client_key zone=chat:10m rate=30r/m;
limit_req_zone $client_key zone=health:10m rate=60r/m;
limit_req_status 429;

upstream agent_api {
    server agent:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location = / { return 302 /autoseguro/; }
    location = /autoseguro { return 301 /autoseguro/; }

    location = /autoseguro/ {
        try_files /index.html =404;
        expires -1;   # Cache-Control: no-cache (sem add_header, para herdar os headers de segurança)
    }

    location = /autoseguro/api/chat {
        limit_except POST { deny all; }
        limit_req zone=chat burst=10 nodelay;
        proxy_pass http://agent_api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        # a quote-api simula lentidão (8s) + retentativas com deadline; folga para o pior caso
        proxy_read_timeout 40s;
    }

    location = /autoseguro/api/health {
        limit_except GET { deny all; }
        limit_req zone=health burst=10 nodelay;
        proxy_pass http://agent_api/health;   # query (?deep=true) é repassada
        proxy_http_version 1.1;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 5s;
    }

    # qualquer outra coisa (inclusive /autoseguro/api/sessions, /maintenance, arquivos soltos)
    location / { return 404; }
}
