# Frontend de demonstração do AutoSeguro (fora do escopo avaliado do desafio).
# Serve o chat em /autoseguro/ e expõe SOMENTE uma rota do agente:
#   /autoseguro/api/chat -> agent:8080/chat (POST)
# NÃO há proxy de /health (revela configuração interna), nem de /sessions e /maintenance/sweep.
# Requer nginx open source >= 1.27.3 (parâmetro `resolve` do `server` em `upstream`).
# Decisões e checklist de validação: docs/ARQUITETURA.md §13 e web/README.md.

# ---- LGPD: log de acesso SEM IP do visitante, user-agent, referer e query string -------------------
# A rota é normalizada (ui/chat/other): caminhos arbitrários de scanners não entram no log.
# Mapeia pelo $request_uri ORIGINAL (o try_files reescreve o $uri para /index.html antes do log);
# o valor só escolhe o rótulo -- a query string nunca é gravada.
map $request_uri $log_route {
    default                          other;
    ~^/autoseguro/?(\?|$)            ui;
    ~^/autoseguro/api/chat(\?|$)     chat;
}
log_format privacy '$time_iso8601 $request_method $log_route $status $body_bytes_sent '
                   '$request_time limit=$limit_req_status rid=$request_id';

# ---- Rate limit por visitante ------------------------------------------------------------------------
# $binary_remote_addr já é o IP REAL: `real_ip` (no server) só confia em CF-Connecting-IP quando a
# conexão vem da sub-rede do compose. ~30 mensagens/min com rajada curta.
limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/m;
limit_req_status 429;
# warn < crit (error_log em nginx.main.conf): a rejeição não gera linha com o IP do cliente.
limit_req_log_level warn;

# ---- R1: upstream que re-resolve o DNS do Docker -------------------------------------------------------
# Sem `resolve` o nginx fixa o IP de `agent` na subida e responde 502 depois que o container é recriado.
# `resolve` exige `zone` (memória compartilhada) e `resolver`. Mantém o keepalive.
# Fallback (nginx < 1.27.3), PERDENDO o keepalive do upstream: ver web/README.md.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream agent_api {
    zone agent_api 64k;
    server agent:8080 resolve;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /dev/stdout privacy;

    # R6: só confia no CF-Connecting-IP vindo da sub-rede FIXADA no docker-compose.web.yml
    # (o cloudflared chega pelo gateway da bridge). Fora dela o header é ignorado.
    set_real_ip_from 172.29.77.0/24;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    root /usr/share/nginx/html;
    client_max_body_size 16k;
    client_header_timeout 10s;   # endurecimento contra conexões lentas
    client_body_timeout 10s;
    send_timeout 10s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location = / { return 302 /autoseguro/; }
    location = /autoseguro { return 301 /autoseguro/; }

    location = /autoseguro/ {
        try_files /index.html =404;
        expires -1;   # Cache-Control: no-cache (sem add_header, para herdar os headers de segurança)
    }

    location = /autoseguro/api/chat {
        limit_except POST { deny all; }
        limit_req zone=chat burst=10 nodelay;
        proxy_pass http://agent_api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        # LGPD: o agente nunca precisa do IP do visitante. Por padrão o nginx repassa TODOS os headers
        # do cliente (inclusive os que o Cloudflare acrescenta); aqui os que carregam IP/origem são zerados.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-Connecting-IPv6 "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_next_upstream off;       # nunca repete um POST: o replay é feito pelo message_id, no agente
        proxy_connect_timeout 3s;      # agente fora do ar falha rápido (antes: 60 s padrão)
        # a quote-api simula lentidão (8s) + retentativas com deadline de 28 s; folga para o pior caso
        proxy_read_timeout 40s;
    }

    # qualquer outra coisa (inclusive /autoseguro/api/health, /sessions, /maintenance, arquivos soltos)
    location / { return 404; }
}
