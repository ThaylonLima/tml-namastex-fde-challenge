# nginx.conf PRINCIPAL do serviço `web` (substitui /etc/nginx/nginx.conf da imagem).
# Existe para controlar o `error_log`, que NÃO pode ser definido em conf.d/default.conf:
# o error_log padrão da imagem (notice) registra o IP do cliente em eventos de erro (upstream
# indisponível, corpo grande demais, ...). Aqui o limiar é `crit`, então esses eventos NÃO são gravados.
#
# RESÍDUO (documentado): eventos crit/alert/emerg podem conter o IP do cliente (raros); e, com o
# limiar em crit, falhas de upstream não aparecem no error_log -- diagnosticar pelo status no
# access log (sem IP) e pelos logs JSONL do agente.
user nginx;
worker_processes auto;
error_log /dev/stderr crit;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;            # o `server` define o próprio access_log (formato `privacy`, sem IP)
    sendfile on;
    keepalive_timeout 15s;
    include /etc/nginx/conf.d/*.conf;
}
